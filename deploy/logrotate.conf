# ──────────────────────────────────────────────────────────────────────────────
#  MyGreenGarden V7 — Rotation des logs
#  Fichier : /etc/logrotate.d/mygreengarden
# ──────────────────────────────────────────────────────────────────────────────

/opt/mygreengarden/logs/*.log {
    # Rotation hebdomadaire
    weekly

    # Conserver 8 semaines (2 mois)
    rotate 8

    # Compresser les anciens logs (gzip)
    compress
    delaycompress

    # Ne pas échouer si le fichier n'existe pas
    missingok
    notifempty

    # Créer un nouveau fichier de log après rotation
    create 640 mgg mgg

    # Recharger nginx après rotation de ses logs
    postrotate
        systemctl reload nginx 2>/dev/null || true
    endscript
}
