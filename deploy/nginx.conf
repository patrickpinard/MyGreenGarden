# ──────────────────────────────────────────────────────────────────────────────
#  MyGreenGarden V7 — Configuration nginx
#  Reverse proxy : port 80 (et 443 si SSL) → uvicorn 127.0.0.1:8000
#  Domaine : serre.ppdlab.ch
# ──────────────────────────────────────────────────────────────────────────────

# Limite de connexions WebSocket simultanées
limit_conn_zone $binary_remote_addr zone=ws_limit:10m;

server {
    listen 80;
    listen [::]:80;
    server_name serre.ppdlab.ch _;   # accepte aussi l'IP directe

    # ── Sécurité ─────────────────────────────────────────────────────────────
    add_header X-Content-Type-Options  nosniff;
    add_header X-Frame-Options         SAMEORIGIN;
    add_header Referrer-Policy         strict-origin-when-cross-origin;

    # Taille max upload (images caméra, etc.)
    client_max_body_size 16M;

    # ── WebSocket — /ws/* ─────────────────────────────────────────────────────
    location /ws/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;

        # Garder la connexion WS ouverte longtemps
        proxy_read_timeout    86400s;
        proxy_send_timeout    86400s;
        proxy_connect_timeout 10s;

        limit_conn ws_limit 20;
    }

    # ── Fichiers statiques — servis directement par nginx ─────────────────────
    location /static/ {
        alias /opt/mygreengarden/src/mygreengarden/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Application principale ────────────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        # Bufferisation pour les réponses JSON/HTML
        proxy_buffering    on;
        proxy_buffer_size  16k;
        proxy_buffers      8 16k;
    }

    # ── Logs ─────────────────────────────────────────────────────────────────
    access_log /opt/mygreengarden/logs/nginx_access.log;
    error_log  /opt/mygreengarden/logs/nginx_error.log  warn;
}

