<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Pipe coming from left (wall) -->
  <rect x="4" y="26" width="12" height="10" rx="2" fill="#d1f5f3" stroke="#1e6b6b" stroke-width="2"/>
  <!-- Valve body (main cylinder) -->
  <rect x="16" y="20" width="22" height="22" rx="5" fill="#d1f5f3" stroke="#1e6b6b" stroke-width="2"/>
  <!-- Valve inner detail -->
  <circle cx="27" cy="31" r="6" fill="white" stroke="#14b8a6" stroke-width="1.5"/>
  <circle cx="27" cy="31" r="2.5" fill="#14b8a6"/>
  <!-- T-handle vertical stem -->
  <line x1="27" y1="12" x2="27" y2="20" stroke="#1e6b6b" stroke-width="2.5" stroke-linecap="round"/>
  <!-- T-handle horizontal bar -->
  <line x1="19" y1="12" x2="35" y2="12" stroke="#1e6b6b" stroke-width="3" stroke-linecap="round"/>
  <!-- Grip marks on handle -->
  <line x1="21" y1="10" x2="21" y2="14" stroke="#1e6b6b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="27" y1="10" x2="27" y2="14" stroke="#1e6b6b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="33" y1="10" x2="33" y2="14" stroke="#1e6b6b" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Pipe exit to right -->
  <path d="M38,27 L48,27 Q54,27 54,33 L54,42" stroke="#1e6b6b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Pipe end (spout opening) -->
  <path d="M50,42 L58,42 L57,46 L51,46 Z" fill="#d1f5f3" stroke="#1e6b6b" stroke-width="1.5"/>
  <!-- Water drops -->
  <path d="M52,48 C52,48 50.5,51 50.5,52.5 a1.8,1.8,0,0,0,3.6,0 C54.1,51 52,48 52,48Z" fill="#5ecdc8" stroke="#14b8a6" stroke-width="1"/>
  <path d="M56,50 C56,50 54.5,53 54.5,54.5 a1.8,1.8,0,0,0,3.6,0 C58.1,53 56,50 56,50Z" fill="#5ecdc8" stroke="#14b8a6" stroke-width="1"/>
  <!-- Teal accent on valve body -->
  <rect x="17" y="21" width="20" height="4" rx="2" fill="#14b8a6" opacity="0.3"/>
</svg>
