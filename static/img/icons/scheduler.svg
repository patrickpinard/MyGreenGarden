<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Calendar body -->
  <rect x="4" y="12" width="42" height="44" rx="4" fill="white" stroke="#1e6b6b" stroke-width="2"/>
  <!-- Calendar header -->
  <rect x="4" y="12" width="42" height="12" rx="4" fill="#14b8a6" stroke="#1e6b6b" stroke-width="2"/>
  <rect x="4" y="18" width="42" height="6" rx="0" fill="#14b8a6"/>
  <!-- Calendar ring hooks -->
  <line x1="15" y1="8" x2="15" y2="16" stroke="#1e6b6b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="31" y1="8" x2="31" y2="16" stroke="#1e6b6b" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Calendar day grid (4 rows × 4 cols) -->
  <!-- Row 1 -->
  <rect x="8"  y="27" width="6" height="5" rx="1" fill="#d1f5f3"/>
  <rect x="16" y="27" width="6" height="5" rx="1" fill="#d1f5f3"/>
  <rect x="24" y="27" width="6" height="5" rx="1" fill="#14b8a6"/>
  <rect x="32" y="27" width="6" height="5" rx="1" fill="#d1f5f3"/>
  <!-- Row 2 -->
  <rect x="8"  y="34" width="6" height="5" rx="1" fill="#d1f5f3"/>
  <rect x="16" y="34" width="6" height="5" rx="1" fill="#d1f5f3"/>
  <rect x="24" y="34" width="6" height="5" rx="1" fill="#d1f5f3"/>
  <rect x="32" y="34" width="6" height="5" rx="1" fill="#1e6b6b"/>
  <!-- Row 3 -->
  <rect x="8"  y="41" width="6" height="5" rx="1" fill="#d1f5f3"/>
  <rect x="16" y="41" width="6" height="5" rx="1" fill="#14b8a6"/>
  <rect x="24" y="41" width="6" height="5" rx="1" fill="#d1f5f3"/>
  <rect x="32" y="41" width="6" height="5" rx="1" fill="#d1f5f3"/>
  <!-- Row 4 (partial) -->
  <rect x="8"  y="48" width="6" height="5" rx="1" fill="#d1f5f3"/>
  <rect x="16" y="48" width="6" height="5" rx="1" fill="#d1f5f3"/>
  <!-- Clock face (overlapping bottom-right) -->
  <circle cx="48" cy="48" r="14" fill="white" stroke="#1e6b6b" stroke-width="2"/>
  <circle cx="48" cy="48" r="12" fill="#d1f5f3"/>
  <!-- Clock tick marks -->
  <line x1="48" y1="37" x2="48" y2="39.5" stroke="#1e6b6b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="48" y1="56.5" x2="48" y2="59" stroke="#1e6b6b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="37" y1="48" x2="39.5" y2="48" stroke="#1e6b6b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="56.5" y1="48" x2="59" y2="48" stroke="#1e6b6b" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Clock hands -->
  <line x1="48" y1="48" x2="48" y2="40" stroke="#1e6b6b" stroke-width="2" stroke-linecap="round"/>
  <line x1="48" y1="48" x2="54" y2="51" stroke="#14b8a6" stroke-width="2" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="48" cy="48" r="2" fill="#1e6b6b"/>
</svg>
