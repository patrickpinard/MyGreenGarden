<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Tube background -->
  <rect x="26" y="5" width="12" height="36" rx="6" fill="#e0f5f5" stroke="#1e6b6b" stroke-width="2.2"/>
  <!-- Mercury fill -->
  <rect x="29.5" y="18" width="5" height="23" rx="2.5" fill="#14b8a6"/>
  <!-- Bulb -->
  <circle cx="32" cy="51" r="10" fill="#14b8a6" stroke="#1e6b6b" stroke-width="2.2"/>
  <!-- Connector fill (tube bottom to bulb) -->
  <rect x="29.5" y="38" width="5" height="13" fill="#14b8a6"/>
  <!-- Tube side lines to cover the seam -->
  <line x1="26" y1="38" x2="26" y2="47" stroke="#1e6b6b" stroke-width="2.2"/>
  <line x1="38" y1="38" x2="38" y2="47" stroke="#1e6b6b" stroke-width="2.2"/>
  <!-- Tick marks -->
  <line x1="38" y1="14" x2="44" y2="14" stroke="#1e6b6b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="38" y1="22" x2="44" y2="22" stroke="#1e6b6b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="38" y1="30" x2="44" y2="30" stroke="#1e6b6b" stroke-width="1.5" stroke-linecap="round"/>
</svg>
