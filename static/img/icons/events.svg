<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Timeline vertical line -->
  <line x1="18" y1="8" x2="18" y2="56" stroke="#d1f5f3" stroke-width="3" stroke-linecap="round"/>
