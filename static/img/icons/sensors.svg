<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Main control panel body -->
  <rect x="4" y="10" width="38" height="46" rx="4" fill="#d1f5f3" stroke="#1e6b6b" stroke-width="2"/>
  <!-- Screen area -->
  <rect x="8" y="14" width="30" height="20" rx="2" fill="#14b8a6" stroke="#1e6b6b" stroke-width="1.5"/>
  <!-- Screen graph line -->
  <polyline points="11,30 15,26 19,28.5 23,23 27,25 34,20" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Panel buttons row -->
  <rect x="8" y="37" width="30" height="9" rx="2" fill="white" stroke="#14b8a6" stroke-width="1.5"/>
  <circle cx="14" cy="41.5" r="2.5" fill="#14b8a6"/>
  <circle cx="23" cy="41.5" r="2.5" fill="#5ecdc8"/>
  <circle cx="32" cy="41.5" r="2.5" fill="#1e6b6b"/>
  <!-- Bottom data bar -->
  <rect x="8" y="49" width="30" height="4" rx="2" fill="white" stroke="#14b8a6" stroke-width="1.5"/>
  <rect x="9" y="50" width="18" height="2" rx="1" fill="#14b8a6"/>
  <!-- Connector lines to right sensors -->
  <line x1="42" y1="22" x2="50" y2="22" stroke="#1e6b6b" stroke-width="1.5"/>
  <line x1="42" y1="36" x2="50" y2="36" stroke="#1e6b6b" stroke-width="1.5"/>
  <line x1="42" y1="50" x2="50" y2="50" stroke="#1e6b6b" stroke-width="1.5"/>
  <!-- Connector dots -->
  <circle cx="42" cy="22" r="2" fill="#1e6b6b"/>
  <circle cx="42" cy="36" r="2" fill="#1e6b6b"/>
  <circle cx="42" cy="50" r="2" fill="#1e6b6b"/>
  <!-- Thermometer (top right) -->
  <rect x="50" y="14" width="8" height="14" rx="4" fill="white" stroke="#1e6b6b" stroke-width="1.5"/>
  <rect x="52.5" y="16.5" width="3" height="7" rx="1.5" fill="#14b8a6"/>
  <circle cx="54" cy="29" r="4.5" fill="#14b8a6" stroke="#1e6b6b" stroke-width="1.5"/>
  <!-- Water drop (mid right) -->
  <path d="M54,31 C54,31 49.5,36.5 49.5,39.5 a4.5,4.5,0,0,0,9,0 C58.5,36.5 54,31 54,31Z" fill="#5ecdc8" stroke="#1e6b6b" stroke-width="1.5"/>
  <!-- Light bulb (bottom right) -->
  <circle cx="54" cy="49" r="4" fill="white" stroke="#1e6b6b" stroke-width="1.5"/>
  <path d="M52,52.5 Q54,54.5 56,52.5" stroke="#1e6b6b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <line x1="52.5" y1="54.5" x2="55.5" y2="54.5" stroke="#1e6b6b" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Glow rays -->
  <line x1="58.5" y1="46.5" x2="60.5" y2="44.5" stroke="#5ecdc8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="60" y1="49" x2="62.5" y2="49" stroke="#5ecdc8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="58.5" y1="51.5" x2="60.5" y2="53.5" stroke="#5ecdc8" stroke-width="1.5" stroke-linecap="round"/>
</svg>
