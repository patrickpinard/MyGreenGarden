[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mygreengarden"
version = "7.0.0"
description = "Contrôleur de serre automatisé - Raspberry Pi 4"
authors = [{ name = "Patrick Pinard" }]
requires-python = ">=3.10"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.12",
    "itsdangerous>=2.2.0",
    # Database
    "sqlmodel>=0.0.22",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    # Config & validation
    "pydantic-settings>=2.6.0",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # Scheduler
    "apscheduler>=3.10.0",
    # Email (async)
    "aiosmtplib>=3.0.0",
    # System monitoring
    "psutil>=6.0.0",
]

[project.optional-dependencies]
raspberry = [
    "gpiozero>=2.0",
    "smbus2>=0.4.3",
    "RPi.GPIO>=0.7.1",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
